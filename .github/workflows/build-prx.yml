name: Test and build The Forest PS4 UCM PRX

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/build-prx.yml"

  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Test C menu core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable C tests
        run: SANITIZE=1 sh scripts/test.sh
      - name: Upload host UI preview (not a PS4 screenshot)
        uses: actions/upload-artifact@v4
        with:
          name: overlay-host-preview
          path: output/overlay-preview.svg
          if-no-files-found: error

  compile-prx:
    name: Cross-compile GoldHEN UCM PRX
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl git
          clang --version | head -1
          ld.lld --version | head -1
      - name: Download OpenOrbis v0.5.4 prebuilt toolchain
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o /tmp/openorbis.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/link.x"
          test -x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/create-fself"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
      - name: Clone GoldHEN SDK and official plugin template
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_Plugins_SDK"
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git "$RUNNER_TEMP/GoldHEN_Plugins_Repository"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_Plugins_SDK" >> "$GITHUB_ENV"
      - name: Build native GNM overlay, DS4 adapter and PRX
        env:
          GOLDHEN_TEMPLATE: ${{ runner.temp }}/GoldHEN_Plugins_Repository
        run: sh scripts/build-prx.sh
      - name: Upload The Forest UCM PRX and checksum
        uses: actions/upload-artifact@v4
        with:
          name: theforest-ucm-prx
          path: |
            output/theforest_ucm.prx
            output/sha256.txt
          if-no-files-found: error
