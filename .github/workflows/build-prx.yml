name: Test and build The Forest PS4 diagnostic PRX

on:
  workflow_dispatch:
  push:
    paths:
      - "source/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/build-prx.yml"

permissions:
  contents: read

jobs:
  tests:
    name: Test C menu core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run portable C tests
        run: |
          cc -std=c99 -Wall -Wextra -Werror -Isrc src/menu.c tests/test_menu.c -o /tmp/theforest_menu_tests
          /tmp/theforest_menu_tests

  compile-prx:
    name: Cross-compile GoldHEN diagnostic PRX
    runs-on: ubuntu-24.04
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM and build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make curl git
          clang --version | head -1
          ld.lld --version | head -1
      - name: Download OpenOrbis v0.5.4 prebuilt toolchain
        run: |
          curl -fL --retry 3 --connect-timeout 30 \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o /tmp/openorbis.tar.gz
          tar -xzf /tmp/openorbis.tar.gz -C "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/link.x"
          test -x "$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain/bin/linux/create-fself"
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
      - name: Clone GoldHEN SDK and official plugin template
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$RUNNER_TEMP/GoldHEN_Plugins_SDK"
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_Repository.git "$RUNNER_TEMP/GoldHEN_Plugins_Repository"
          echo "GOLDHEN_SDK=$RUNNER_TEMP/GoldHEN_Plugins_SDK" >> "$GITHUB_ENV"
      - name: Build GoldHEN SDK
        run: make -C "$GOLDHEN_SDK" PRINTF=1
      - name: Build only diagnostic plugin from official template
        run: |
          set -eu
          UPSTREAM="$RUNNER_TEMP/GoldHEN_Plugins_Repository"
          cp source/plugin_main.c "$UPSTREAM/plugin_src/plugin_template/source/main.c"
          mkdir -p "$UPSTREAM/bin/plugins/prx_final" "$UPSTREAM/bin/plugins/elf_final"
          make -C "$UPSTREAM/plugin_src/plugin_template" DEBUG=0
          install -Dm644 "$UPSTREAM/bin/plugins/prx_final/plugin_template.prx" output/theforest_ucm_probe.prx
          sha256sum output/theforest_ucm_probe.prx > output/sha256.txt
          file output/theforest_ucm_probe.prx
          cat output/sha256.txt
      - name: Upload diagnostic PRX (not a menu)
        uses: actions/upload-artifact@v4
        with:
          name: theforest-ucm-probe-prx
          path: output/
          if-no-files-found: error
